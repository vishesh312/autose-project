[project]
name = "parbench"
version = "0.1.0"
description = "Benchmark harness for coding agents doing k concurrent (possibly conflicting) tasks, built on CooperBench"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
parbench = "parbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parbench"]
